name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shell-quality:
    name: Shell quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes shellcheck
          fi

      - name: Check shell syntax
        shell: bash
        run: |
          shell_scripts=(
            scripts/ops/hermes-unchained
            scripts/ops/*.sh
            start-hermes-omni.sh
            start-omniroute.sh
          )
          bash -n "${shell_scripts[@]}"

      - name: Run ShellCheck
        shell: bash
        run: |
          shell_scripts=(
            scripts/ops/hermes-unchained
            scripts/ops/*.sh
            start-hermes-omni.sh
            start-omniroute.sh
          )
          shellcheck "${shell_scripts[@]}"

  repository-health:
    name: Repository health
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify supported Node.js runtime
        run: npm run check:node-runtime

      - name: Type-check core packages
        run: npm run typecheck:core
